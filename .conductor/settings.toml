"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
setup = "npm install && npm run db:migrate"
archive = "npx tsx scripts/wipe-dev-db.ts"
run_mode = "concurrent"

[scripts.run.dev]
available_in = ["local"]
command = "npx tsx scripts/seed-dev-voter.ts && PUBLIC_BASE_URL=http://localhost:$CONDUCTOR_PORT npm run dev -- --port $CONDUCTOR_PORT"
default = true
icon = "play"
