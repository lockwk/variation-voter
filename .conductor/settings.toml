"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
setup = "bash scripts/sync-root.sh; npm install; npx tsx scripts/provision-workspace-db.ts"
archive = "npx tsx scripts/teardown-workspace-db.ts"
run_mode = "concurrent"

[scripts.run.dev]
available_in = ["local"]
command = "npx tsx scripts/seed-dev-voter.ts && PUBLIC_BASE_URL=http://localhost:$CONDUCTOR_PORT npm run dev -- --port $CONDUCTOR_PORT"
default = true
icon = "play"
